<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAR — exploded parts, clickable hotspots (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root{--far-white:oklch(0.97 0.003 80);--far-smoke:oklch(0.62 0.005 60);--far-line:oklch(0.30 0.004 60);--ease:cubic-bezier(0.16,1,0.3,1);--pad:clamp(1.25rem,5vw,6.5rem)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
body{color:var(--far-white);font-family:"DM Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
h2{font-family:"Space Grotesk",sans-serif;font-weight:700;line-height:0.94;letter-spacing:-0.035em}
.eyebrow{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:0.76rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--far-smoke)}
.explode{padding:clamp(3.5rem,9vw,7rem) var(--pad);max-width:1100px;margin-inline:auto}
.explode .eyebrow{margin-bottom:1.2rem}
.explode h2{font-size:clamp(1.9rem,5vw,3.6rem);max-width:17ch;margin-bottom:0.8rem}
.hint{color:var(--far-smoke);font-size:0.95rem;margin-bottom:clamp(2rem,5vw,3.2rem)}
.hint b{color:var(--far-white);font-weight:500}

.stage{position:relative;width:min(560px,92vw);margin-inline:auto;aspect-ratio:466/600}
.stage>img{width:100%;height:100%;object-fit:contain;display:block;transition:filter .35s var(--ease)}
.stage.dimmed>img{filter:brightness(0.5)}
.spot{position:absolute;border-radius:50%;cursor:pointer;outline:none;
  background:radial-gradient(circle, color-mix(in oklch,var(--far-white) 16%,transparent) 0%, transparent 68%);
  opacity:0;transition:opacity .3s var(--ease);transform:scale(0.6)}
.spot.on{opacity:1;transform:scale(1)}
/* invisible larger hit target sits on top of each spot */
.hit{position:absolute;cursor:pointer;background:transparent}

.card{max-width:560px;margin:clamp(1.8rem,4vw,2.6rem) auto 0;border:1px solid var(--far-line);border-radius:10px;padding:1.1rem 1.3rem;min-height:5.4rem;
  background:color-mix(in oklch, #000 55%, transparent);backdrop-filter:blur(6px);transition:border-color .3s var(--ease)}
.card.live{border-color:color-mix(in oklch,var(--far-white) 40%,transparent)}
.card .ct{font-family:"Space Grotesk";font-weight:700;font-size:1.2rem;letter-spacing:-0.01em;margin-bottom:0.3rem;color:var(--far-white)}
.card .cd{color:var(--far-smoke);font-size:1rem}
.card .idle{color:var(--far-smoke);font-size:1rem}
</style>
</head>
<body>
<section class="explode">
  <div class="eyebrow">Built to be cut open</div>
  <h2>Nothing to hide. The real build, pulled apart.</h2>
  <p class="hint"><b class="d">Hover</b><b class="t">Tap</b> a part to see what it does.</p>

  <div class="stage" id="stage">
    <img src="boot_exploded.png" alt="Exploded view of the FAR boot">
    <!-- spots: glow ring (visual) -->
    <!-- hits: invisible click/hover targets -->
  </div>

  <div class="card" id="card">
    <p class="idle" id="idle">Hover a part of the boot.</p>
    <div class="ct" id="ct" style="display:none"></div>
    <div class="cd" id="cd" style="display:none"></div>
  </div>
</section>

<script>
// first-pass hotspot map: {name, desc, x,y (centre %), w,h (% of stage)}
const PARTS = [
  {n:"Nubuck upper", d:"Wheat nubuck, side zip, water-resistant. Built to AS/NZS 2210.3.", x:34,y:37,w:42,h:34},
  {n:"Padded tongue", d:"Padded across the top of your foot so the laces don't bite.", x:73,y:13,w:26,h:20},
  {n:"Laces", d:"Heavy laces with speed hooks up top. Fast on, fast off.", x:70,y:31,w:28,h:18},
  {n:"Side zip", d:"Full side zip. On and off without touching the laces.", x:12,y:48,w:18,h:24},
  {n:"Steel toe cap", d:"Certified to AS/NZS 2210.3. The number a real safety boot has to hit.", x:70,y:56,w:28,h:16},
  {n:"Poron insole", d:"Blue memory foam over Poron. Comfortable from the first shift. No break-in.", x:50,y:60,w:44,h:13},
  {n:"Anti-puncture plate", d:"A penetration-resistant plate underfoot. A nail through the sole stops here, not in your foot.", x:51,y:72,w:46,h:12},
  {n:"SC-TPU heel", d:"Energy-return foam moulded into the heel. The same supercritical process as Adidas Ultraboost.", x:35,y:82,w:30,h:10},
  {n:"Nitrile outsole", d:"Rated to 300°C. Most work boots tap out near 130. Grip that holds on a hot slab.", x:52,y:91,w:54,h:15},
];
const stage=document.getElementById('stage'), card=document.getElementById('card');
const idle=document.getElementById('idle'), ct=document.getElementById('ct'), cd=document.getElementById('cd');
const spots=[];
PARTS.forEach((p,i)=>{
  const spot=document.createElement('div'); spot.className='spot';
  const d=Math.max(p.w,p.h)*1.1;
  spot.style.cssText=`left:${p.x-d/2}%;top:${p.y-d/2}%;width:${d}%;height:${d*466/600}%`;
  stage.appendChild(spot); spots.push(spot);
  const hit=document.createElement('div'); hit.className='hit'; hit.tabIndex=0; hit.setAttribute('role','button'); hit.setAttribute('aria-label',p.n);
  hit.style.cssText=`left:${p.x-p.w/2}%;top:${p.y-p.h/2}%;width:${p.w}%;height:${p.h}%`;
  stage.appendChild(hit);
  function on(){ show(i); }
  function off(){ clear(); }
  hit.addEventListener('pointerenter',e=>{ if(e.pointerType==='mouse') on(); });
  hit.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') off(); });
  hit.addEventListener('click',()=>{ active===i?clear():show(i); });
  hit.addEventListener('focus',on); hit.addEventListener('blur',off);
});
let active=null;
function show(i){ active=i; const p=PARTS[i];
  spots.forEach((s,j)=>s.classList.toggle('on',j===i));
  stage.classList.add('dimmed'); card.classList.add('live');
  idle.style.display='none'; ct.style.display='block'; cd.style.display='block';
  ct.textContent=p.n; cd.textContent=p.d;
}
function clear(){ active=null;
  spots.forEach(s=>s.classList.remove('on'));
  stage.classList.remove('dimmed'); card.classList.remove('live');
  idle.style.display='block'; ct.style.display='none'; cd.style.display='none';
}
const touch=matchMedia('(hover:none)').matches;
document.querySelectorAll('.hint .d').forEach(e=>e.style.display=touch?'none':'inline');
document.querySelectorAll('.hint .t').forEach(e=>e.style.display=touch?'inline':'none');
if(touch) idle.textContent='Tap a part of the boot.';
</script>
</body>
</html>
